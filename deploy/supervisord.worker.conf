[program:chromium]
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",DISPLAY="%(ENV_DISPLAY)s"
command=/usr/local/bin/launch-gostream3d.sh
stopsignal=INT
autorestart=true
priority=800
user=%(ENV_USER)s
stdout_logfile=/var/log/neko/chromium.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
redirect_stderr=true

[program:chromium-window]
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",DISPLAY="%(ENV_DISPLAY)s"
command=/usr/local/bin/sync-chromium-window.sh
autorestart=true
stopasgroup=true
killasgroup=true
priority=900
user=%(ENV_USER)s
stdout_logfile=/var/log/neko/chromium-window.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=1
redirect_stderr=true

# Chromium's GUI build binds DevTools to loopback even with an address flag.
# Keep it private on 9223 and expose the manager's container port through a proxy.
[program:chromium-cdp]
command=/usr/bin/socat TCP-LISTEN:9222,bind=0.0.0.0,reuseaddr,fork TCP:127.0.0.1:9223
autorestart=true
priority=700
user=%(ENV_USER)s
stdout_logfile=/var/log/neko/chromium-cdp.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=1
redirect_stderr=true
